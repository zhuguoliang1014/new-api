name: Build and Push Aiproxy Image

on:
  push:
    branches:
      - main

# Finish an active deployment; replace older pending work with the newest push.
concurrency:
  group: aiproxy-production-main
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/zhuguoliang1014/new-api

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test deployment automation
        run: python3 -m unittest discover -s scripts/deploy -p 'test_*.py' -v

      - name: Resolve version
        id: version
        run: |
          # Always derive base version from upstream official tags.
          git fetch --force https://github.com/Calcium-Ion/new-api.git "refs/tags/*:refs/tags/upstream/*"
          OFFICIAL_TAG="$(git describe --tags --abbrev=0 --match 'upstream/v*' 2>/dev/null || true)"
          if [ -z "$OFFICIAL_TAG" ]; then
            OFFICIAL_TAG="$(git describe --tags --abbrev=0 --match 'upstream/*' 2>/dev/null || echo 'upstream/untagged')"
          fi
          OFFICIAL_TAG="${OFFICIAL_TAG#upstream/}"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          VERSION="${OFFICIAL_TAG}+${SHORT_SHA}"
          DOCKER_TAG="${OFFICIAL_TAG}-${SHORT_SHA}"
          echo "$VERSION" > VERSION
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$DOCKER_TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version: $VERSION"
          echo "Docker tag: $DOCKER_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push (linux/amd64)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    steps:
      - name: Checkout deployment automation
        uses: actions/checkout@v4

      - name: Prepare deployment script
        id: script
        run: echo "payload=$(base64 -w0 scripts/deploy/deploy_new_api.py)" >> "$GITHUB_OUTPUT"

      - name: Deploy the image built by this run
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_RUN_NUMBER: ${{ github.run_number }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_SCRIPT_B64: ${{ steps.script.outputs.payload }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 18m
          envs: DEPLOY_PATH,DEPLOY_IMAGE,DEPLOY_REVISION,DEPLOY_RUN_NUMBER,DEPLOY_RUN_ID,DEPLOY_SCRIPT_B64
          script_stop: true
          script: |
            set -eu
            python3 - <<'PYTHON'
            import base64, os
            source = base64.b64decode(os.environ["DEPLOY_SCRIPT_B64"], validate=True)
            exec(compile(source, "deploy_new_api.py", "exec"))
            PYTHON

      - name: Deployment summary
        run: |
          echo "Deployed commit ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Container health and application version verified automatically." >> "$GITHUB_STEP_SUMMARY"
